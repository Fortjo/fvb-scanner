name: Weekly 33FVB Scan

on:
  schedule:
    # Runs every Saturday at 6:00 AM Bulgaria time. GitHub Actions cron is
    # ALWAYS UTC — Bulgaria is UTC+3 in summer (EEST) and UTC+2 in winter
    # (EET), so this line needs a manual one-hour adjustment twice a year:
    #   Summer (EEST, roughly late Mar-late Oct): use '0 3 * * 6' (current)
    #   Winter (EET,  roughly late Oct-late Mar):  use '0 4 * * 6'
    - cron: '25 6 * * 0'
  workflow_dispatch:
    # Lets you manually trigger a run anytime from the GitHub Actions tab,
    # e.g. to test the setup without waiting for Saturday.

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run scan and send email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python send_scan_email.py
